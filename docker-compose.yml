# ==============================================================================
# Docker Compose: Swasthya Sense Multi-Service Architecture
# Web (Nginx SPA proxy) on :8080 | API (FastAPI ML Inference) on :8000
# ==============================================================================

services:
  api:
    build:
      context: .
      dockerfile: Dockerfile.api
      args:
        GIT_SHA: ${GIT_SHA:-dev}
    image: swasthya-sense-api:latest
    container_name: swasthya_sense_api
    ports:
      - "8000:8000"
    environment:
      - PORT=8000
      - PYTHONUNBUFFERED=1
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8000/api/v1/health"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 60s
    restart: unless-stopped

  web:
    build:
      context: .
      dockerfile: Dockerfile.web
      args:
        GIT_SHA: ${GIT_SHA:-dev}
    image: swasthya-sense-web:latest
    container_name: swasthya_sense_web
    ports:
      - "8080:80"
    depends_on:
      api:
        condition: service_healthy
    restart: unless-stopped
