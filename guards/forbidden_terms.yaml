# Non-negotiable principle: NEVER DIAGNOSE
# The system never names a condition, disease or diagnosis anywhere in the UI,
# API output, messages or readouts.
# Readouts are strictly limited to what the report itself states and the lab's own reference ranges.
# A clinician records the clinical assessment.

